extends: leaderboard_v2.yaml

training:
  experiments:
    - name: lgb_raw_bagged
      model: lightgbm
      view: raw
      params:
        n_estimators: 1900
        learning_rate: 0.055
        num_leaves: 31
        min_child_samples: 45
        subsample: 0.80
        subsample_freq: 1
        colsample_bytree: 0.75
        reg_alpha: 0.10
        reg_lambda: 2.0
    - name: lgb_raw_wide
      model: lightgbm
      view: raw
      params:
        n_estimators: 1600
        learning_rate: 0.05
        num_leaves: 63
        min_child_samples: 80
        subsample: 0.90
        subsample_freq: 1
        colsample_bytree: 0.90
        reg_alpha: 0.15
        reg_lambda: 3.0

output:
  directory: outputs/leaderboard_v2
