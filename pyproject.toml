[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-s6e8"
version = "0.1.0"
description = "Reproducible ROC-AUC competition pipeline for Kaggle Playground S6E8"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=18,<26",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
boosters = [
  "catboost>=1.2.7,<2",
  "lightgbm>=4.3,<5",
  "xgboost>=3,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
